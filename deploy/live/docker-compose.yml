# The live server: OpenMU and its PostgreSQL database in two containers, on one VPS.
# Used by .github/workflows/deploy-live.yml; the setup is described in README.md next to this file.
# Copy this folder to /opt/openmu on the server, create .env from .env.example, then `docker compose up -d`.
services:
  openmu:
    image: ${OPENMU_IMAGE:-ghcr.io/rauseklis/openmu:latest}
    container_name: openmu
    restart: unless-stopped
    depends_on:
      - database
    ports:
      # The connect server (the client logs in here; 44406 is for the open-source client definition) ...
      - "44405:44405"
      - "44406:44406"
      # ... the game servers and the chat server.
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "55980:55980"
      # The admin panel is only reachable from the server itself; open it through an SSH tunnel (see README.md).
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # The address the game client is told to connect to after the server list: the public IP of this VPS.
      RESOLVE_IP: ${PUBLIC_IP}
      DB_HOST: database
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PW: ${DB_ADMIN_PW}
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-admin}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD}
    volumes:
      - adminpanel-keys:/app/data-protection-keys
      - logs:/app/logs
    working_dir: /app/

  database:
    image: postgres:17
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PW}
      POSTGRES_DB: ${DB_NAME:-openmu}
    # Not published: only the openmu container can reach the database.
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  adminpanel-keys:
  logs:
  dbdata:
